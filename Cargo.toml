[package]
name = "rustvers"
version = "0.1.0"
edition = "2024"
description = "Лёгкое хранилище заметок (Markdown + HTML) с графом связей"

[lib]
name = "rustvers"
path = "src/lib.rs"

[[bin]]
name = "rustvers"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
# Встраивает фронтенд в бинарь (без dev-сервера).
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
walkdir = "2"
percent-encoding = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# Та же версия, что использует Tauri: нужна для снятия ограничения 60 fps.
webkit2gtk = "2.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
