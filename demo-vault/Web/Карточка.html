<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: system-ui; background: linear-gradient(135deg, #0f172a, #312e81); color: #e0e7ff; min-height: 100vh; display: grid; place-items: center; }
  .card { background: #ffffff14; border: 1px solid #ffffff2a; border-radius: 16px; padding: 32px 40px; max-width: 520px; backdrop-filter: blur(8px); }
  h1 { margin-top: 0; }
  a { color: #a5b4fc; }
  button { background: #6366f1; color: white; border: 0; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <h1>HTML-заметка</h1>
    <p>Свои стили, свои скрипты. Ссылки: [[Rust]], <a href="../Добро пожаловать.md">домой</a>, <a href="https://example.org">наружу</a>.</p>
    <p>Счётчик: <button id="b">нажато 0</button></p>
    <pre>[[это не ссылка]]</pre>
  </div>
  <script>let n = 0; b.onclick = () => b.textContent = `нажато ${++n}`;</script>
</body>
</html>
